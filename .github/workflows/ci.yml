name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build/core
          -DABYSS_BUILD_UI=OFF
          -DABYSS_WITH_OBS=OFF
          -DABYSS_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/core --config Release

      - name: Test
        run: ctest --test-dir build/core -C Release --output-on-failure
